<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nila Assistant</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6d5efc">

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #6d5efc;
      --primary2: #8a7fff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
    }

    .title {
      font-size: 24px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      opacity: .95;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button,
    .file-label {
      border: 0;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: white;
      color: var(--primary);
    }

    .file-label input {
      display: none;
    }

    .container {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 4px 14px rgba(16,24,40,.04);
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #ede9fe;
      color: #5b4de8;
      font-size: 12px;
      font-weight: 800;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 300px;
    }

    .msg {
      max-width: 86%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #e9edff;
    }

    .bot {
      align-self: flex-start;
      background: #f3f4f6;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      width: 100%;
      min-height: 56px;
      max-height: 150px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      font-size: 15px;
      font-family: inherit;
      background: white;
    }

    .send {
      min-width: 82px;
      background: var(--primary);
      color: white;
    }

    .send:disabled {
      opacity: .6;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    img.preview {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fafafa;
    }

    footer {
      padding: 12px 16px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="title">Nila</div>

    <div class="subtitle" id="tagline">
      உங்கள் AI மொபைல் உதவியாளர்
    </div>

    <div class="toolbar">
      <button onclick="setLang('ta')">தமிழ்</button>

      <button onclick="setLang('en')">English</button>

      <button onclick="startVoice()">🎤 Voice</button>

      <button id="voiceReplyBtn" onclick="toggleVoiceReply()">
        🔊 Reply ON
      </button>

      <button onclick="installPromptHandler()">
        ⬇ Install
      </button>

      <label class="file-label">
        📷 Photo
        <input
          type="file"
          accept="image/*"
          onchange="handleImage(event)"
        >
      </label>
    </div>
  </header>


  <div class="container">

    <div class="card">
      <span class="badge">AI Connected</span>

      <div class="muted" style="margin-top:8px;">
        Nila secure backend-க்கு இணைக்கப்பட்டுள்ளது.
      </div>
    </div>


    <div class="card">
      <div id="chat"></div>
    </div>


    <div
      class="card"
      id="imageCard"
      style="display:none;"
    >
      <div
        style="font-weight:700;margin-bottom:10px;"
      >
        Upload செய்த படம்
      </div>

      <img
        id="preview"
        class="preview"
        alt="Uploaded image"
      >
    </div>


    <div class="card">

      <div class="row">

        <textarea
          id="prompt"
          placeholder="Nila-விடம் ஏதேனும் கேளுங்கள்..."
        ></textarea>

        <button
          id="sendBtn"
          class="send"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

      <div
        class="muted"
        style="margin-top:8px;"
      >
        உதாரணம்: "Tyre wear-ஐ தமிழில் explain பண்ணு"
      </div>

    </div>

  </div>


  <footer>
    Nila AI Assistant
  </footer>

</div>


<script>

let lang = 'ta';

let deferredPrompt = null;

let voiceReplyEnabled = true;


const API_URL =
  'https://nila-v2-backend.vercel.app/api/chat';


const texts = {

  ta: {
    tagline:
      'உங்கள் AI மொபைல் உதவியாளர்',

    placeholder:
      'Nila-விடம் ஏதேனும் கேளுங்கள்...',

    send:
      'Send',

    empty:
      'ஒரு கேள்வியை type செய்யுங்கள்.',

    welcome:
      'வணக்கம்! நான் Nila. 😊\\n\\nஉங்களுக்கு என்ன உதவி வேண்டும்?',

    connecting:
      'AI connection error: ',

    speechUnsupported:
      'இந்த browser-ல் voice input support இல்லை.',

    installLater:
      'Install option இன்னும் browser-ல் available இல்லை. Chrome menu-ல் Add to Home Screen பயன்படுத்தலாம்.'
  },


  en: {
    tagline:
      'Your AI mobile assistant',

    placeholder:
      'Ask Nila anything...',

    send:
      'Send',

    empty:
      'Please type a message.',

    welcome:
      'Hello! I am Nila. 😊\\n\\nHow can I help you?',

    connecting:
      'AI connection error: ',

    speechUnsupported:
      'Voice input is not supported in this browser.',

    installLater:
      'Install is not available yet. You can use Add to Home Screen from the Chrome menu.'
  }

};


function addMessage(text, who = 'bot') {

  const msg =
    document.createElement('div');

  msg.className =
    `msg ${who}`;

  msg.textContent =
    text;

  document
    .getElementById('chat')
    .appendChild(msg);

  msg.scrollIntoView({
    behavior: 'smooth',
    block: 'end'
  });

}


function setLang(newLang) {

  lang =
    newLang;

  const t =
    texts[lang];

  document
    .getElementById('tagline')
    .textContent =
    t.tagline;

  document
    .getElementById('prompt')
    .placeholder =
    t.placeholder;

  document
    .getElementById('sendBtn')
    .textContent =
    t.send;

  document
    .getElementById('chat')
    .innerHTML =
    '';

  addMessage(
    t.welcome,
    'bot'
  );

}


async function sendMessage() {

  const box =
    document.getElementById('prompt');

  const text =
    box.value.trim();


  if (!text) {

    alert(
      texts[lang].empty
    );

    return;

  }


  addMessage(
    text,
    'user'
  );

  box.value =
    '';


  const btn =
    document.getElementById('sendBtn');

  btn.disabled =
    true;

  btn.textContent =
    '...';


  try {

    const response =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              message: text,
              language: lang
            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        'Request failed'
      );

    }


    const replyText =
      data.reply ||
      'No response returned.';


    addMessage(
      replyText,
      'bot'
    );


    speakReply(
      replyText
    );


  } catch (error) {

    addMessage(
      texts[lang].connecting +
      error.message,
      'bot'
    );

  } finally {

    btn.disabled =
      false;

    btn.textContent =
      texts[lang].send;

  }

}


function toggleVoiceReply() {

  voiceReplyEnabled =
    !voiceReplyEnabled;


  const btn =
    document.getElementById(
      'voiceReplyBtn'
    );


  btn.textContent =
    voiceReplyEnabled
      ? '🔊 Reply ON'
      : '🔇 Reply OFF';


  if (
    !voiceReplyEnabled &&
    'speechSynthesis' in window
  ) {

    window
      .speechSynthesis
      .cancel();

  }

}


function speakReply(text) {

  if (!voiceReplyEnabled) {
    return;
  }


  if (
    !('speechSynthesis' in window)
  ) {
    return;
  }


  window
    .speechSynthesis
    .cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    lang === 'ta'
      ? 'ta-IN'
      : 'en-IN';


  utterance.rate =
    1;


  utterance.pitch =
    1;


  const voices =
    window
      .speechSynthesis
      .getVoices();


  const preferred =
    voices.find(
      function(v) {

        const voiceLang =
          v.lang
            .toLowerCase();

        if (lang === 'ta') {

          return voiceLang
            .startsWith('ta');

        }

        return voiceLang
          .startsWith('en-in');

      }
    );


  if (preferred) {

    utterance.voice =
      preferred;

  }


  window
    .speechSynthesis
    .speak(
      utterance
    );

}


function handleImage(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  const imageCard =
    document.getElementById(
      'imageCard'
    );

  const preview =
    document.getElementById(
      'preview'
    );


  imageCard.style.display =
    'block';


  preview.src =
    URL.createObjectURL(
      file
    );


  addMessage(
    lang === 'ta'
      ? 'படம் upload ஆனது.'
      : 'Photo uploaded.',
    'bot'
  );

}


function startVoice() {

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {

    alert(
      texts[lang]
        .speechUnsupported
    );

    return;

  }


  const recognition =
    new SR();


  recognition.lang =
    lang === 'ta'
      ? 'ta-IN'
      : 'en-IN';


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onresult =
    function(event) {

      document
        .getElementById(
          'prompt'
        )
        .value =
        event
          .results[0][0]
          .transcript;

    };


  recognition.start();

}


window.addEventListener(
  'beforeinstallprompt',
  function(event) {

    event.preventDefault();

    deferredPrompt =
      event;

  }
);


async function installPromptHandler() {

  if (!deferredPrompt) {

    alert(
      texts[lang]
        .installLater
    );

    return;

  }


  deferredPrompt.prompt();


  await deferredPrompt
    .userChoice;


  deferredPrompt =
    null;

}


document
  .getElementById('prompt')
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key ===
          'Enter' &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


if (
  'serviceWorker' in navigator
) {

  window.addEventListener(
    'load',
    function() {

      navigator
        .serviceWorker
        .register('./sw.js')
        .catch(
          function() {}
        );

    }
  );

}


setLang('ta');

</script>

</body>
</html>
